<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patricia Sin</title>
    <link rel="stylesheet" href="./styles.css">
    <script src="https://kit.fontawesome.com/2b880c8da7.js" crossorigin="anonymous"></script>
</head>
<body>
    <section id="about-me">
        <nav>
            <div class="personal__logo">Patricia Sin</div>
            <ul class="nav__link--list">
                <li>
                    <a href="" class="
                        nav__link--anchor
                        link__hover-effect
                        link__hover-effect--black
                    ">Languages</a>
                </li>
                 <li>
                    <a href="" class="
                        nav__link--anchor
                        link__hover-effect
                        link__hover-effect--black
                    ">Projects</a>
                </li>
                 <li>
                    <a href="" class="
                        nav__link--anchor
                        nav__link--anchor-primary
                    ">Contacts</a>
                </li>
            </ul>
        </nav>
        <div class="flex flex-1">
            <div class="about-me__info row">
                <div class="about-me__info--container">
                    <figure class="about-me__picture--mask">
                        <img src="./assets/pati.jpg" class="about-me__picture" alt="Picture of Me!">
                    </figure>
                    <h1 class="about-me__info--title">
                        Hey! I'm <span class="text--purple">Patricia Sin</span> 👋
                    </h1>
                    <p class="about-me__info--para">
                        I am currently learning <strong class="text--purple">frontend development</strong> through FES, to further my career and expand my knowledge.
                    </p>
                    <div class="about-me__links">
                        <a href="" class="about-me__link">
                            <i class="fa-brands fa-linkedin-in"></i>
                        </a>
                        <a href="" class="about-me__link">
                            <i class="fa-brands fa-github"></i>
                        </a>
                        <a href="" class="about-me__link">
                            <i class="fa-regular fa-envelope"></i>
                        </a>
                        <a href="" class="about-me__link">
                            <i class="fa-solid fa-file-pdf"></i>
                        </a>
                    </div>
                </div>
                <figure class="about-me__img--container">
                    <img src="./assets/undraw_websites.svg" class="about-me__img" alt="">
                </figure>
            </div>
        </div>

                    </div>
                    <div class="language">

                    </div>
                    <div class="language">

                    </div>
                    <div class="language">

                    </div>
                    <div class="language">

                    </div>
                    <div class="language">
                        <figure class="language__img--wrapper">
                            <img src="./assets/blu-react.jpg" alt="" class="language__img">
                        </figure>
                        <span class="language__name">HTML</span>
                    </div>
                    <div class="language">
                        <figure class="language__img--wrapper">
                            <img src="./assets/mobx.png" alt="" class="language__img">
                        </figure>
                        <span class="language__name">HTML</span>
                    </div>
                </div>

        </div>

    <section id="projects">
        <div class="container">
            <div class="row">
                <h1 class="section__title">Here are some of my <span class="text--purple">projects</span></h1>
